name: finbot-notifications
services:
  notifications:
    image: ${FINBOT_NOTIFICATIONS_IMAGE:?Set a dedicated immutable notification image digest}
    env_file:
      - path: ${FINBOT_NOTIFICATIONS_ENV_FILE:?Set the absolute path to the private notification env file}
        format: raw
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.25
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
