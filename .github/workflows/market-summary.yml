name: Financial Market Summary Scheduler

on:
  schedule:
    # Hafta içi 10:25 (Europe/Istanbul UTC+3 -> 07:25 UTC)
    - cron: "25 7 * * 1-5"
    # Hafta içi 18:30 (Europe/Istanbul UTC+3 -> 15:30 UTC)
    - cron: "30 15 * * 1-5"
  workflow_dispatch:
    inputs:
      job_type:
        description: 'Which job to run? (morning / closing / auto)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - closing

jobs:
  run-market-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine & Execute Job
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          TIMEZONE: "Europe/Istanbul"
        run: |
          UTC_TIME=$(date -u)
          EVENT_SCHEDULE="${{ github.event.schedule }}"
          INPUT_JOB="${{ github.event.inputs.job_type }}"
          EVENT_NAME="${{ github.event_name }}"

          echo "Current UTC Time: ${UTC_TIME}"
          echo "GitHub Event Name: ${EVENT_NAME}"
          echo "GitHub Event Schedule: ${EVENT_SCHEDULE}"
          echo "Input Job Type: ${INPUT_JOB}"

          TARGET_JOB=""

          if [ "$INPUT_JOB" = "morning" ]; then
            TARGET_JOB="morning"
          elif [ "$INPUT_JOB" = "closing" ]; then
            TARGET_JOB="closing"
          elif [ "$EVENT_SCHEDULE" = "25 7 * * 1-5" ]; then
            TARGET_JOB="morning"
          elif [ "$EVENT_SCHEDULE" = "30 15 * * 1-5" ]; then
            TARGET_JOB="closing"
          fi

          if [ "$TARGET_JOB" = "morning" ]; then
            echo "Selected Job Type: morning_job"
            python -m app.jobs.morning_job
          elif [ "$TARGET_JOB" = "closing" ]; then
            echo "Selected Job Type: closing_job"
            python -m app.jobs.closing_job
          else
            echo "Error: Unknown trigger state. Unable to determine job type."
            echo "Event Name: '${EVENT_NAME}', Event Schedule: '${EVENT_SCHEDULE}', Input Job: '${INPUT_JOB}'"
            exit 1
          fi
