name: Binance Crypto Latest Prices Daily Sync

on:
  schedule:
    # 7 days a week at Turkey Time: 08:17, 10:17, 12:17, 14:17, 16:17, 18:17, 20:17, 22:17, 00:17
    # (UTC+3 -> UTC: 05:17, 07:17, 09:17, 11:17, 13:17, 15:17, 17:17, 19:17, 21:17)
    - cron: "17 5,7,9,11,13,15,17,19,21 * * *"
  workflow_dispatch:

concurrency:
  group: binance-crypto-latest-prices-sync
  cancel-in-progress: false

jobs:
  sync-binance-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements/jobs/binance.txt

      - name: Install Dependencies
        run: |
          python -m pip install --requirement requirements/jobs/binance.txt
          python -m pip check

      - name: Synchronize Binance Crypto Latest Prices
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TIMEZONE: "Europe/Istanbul"
        run: |
          python -m app.jobs.binance_crypto_latest_prices_job --apply-db
