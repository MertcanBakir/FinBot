name: NASDAQ100 Latest Prices Sync

on:
  schedule:
    # Weekdays 13:10–21:40 UTC, every 30 minutes; covers EDT and EST.
    # The job checks the NASDAQ calendar and its valid execution window.
    - cron: "10,40 13-21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: nasdaq-latest-prices-sync
  cancel-in-progress: false

jobs:
  sync-nasdaq-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements/jobs/nasdaq.txt

      - name: Install Dependencies
        run: |
          python -m pip install --requirement requirements/jobs/nasdaq.txt
          python -m pip check

      - name: Synchronize NASDAQ100 Latest Prices
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python -m app.jobs.nasdaq_latest_prices_job --apply-db
