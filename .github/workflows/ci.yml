name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --requirement requirements/dev.txt
          python -m pip check

      - name: Run Ruff
        run: python -m ruff check .

  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --requirement requirements/dev.txt
          python -m pip check

      - name: Run tests with branch coverage
        run: |
          python -m pytest -p no:cacheprovider -q \
            --cov=app \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-report=xml

      - name: Upload coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
          retention-days: 14

  database-integration:
    name: Database integration
    needs:
      - lint
      - tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/dev.txt

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Install development dependencies
        run: |
          python -m pip install --requirement requirements/dev.txt
          python -m pip check

      - name: Verify database test prerequisites
        run: |
          docker version
          psql --version
          supabase --version

      - name: Run database integration suite
        run: bash ./scripts/test_db_integration.sh

