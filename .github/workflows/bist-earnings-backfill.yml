name: BIST Earnings Backfill

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Target calendar year for BIST earnings backfill'
        required: true
        default: '2026'

concurrency:
  group: calendar-refresh-jobs
  cancel-in-progress: false

jobs:
  backfill:
    name: Run BIST Earnings Backfill
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run BIST Earnings Backfill Job
        run: |
          python -m app.jobs.bist_earnings_backfill_job --year "${{ github.event.inputs.year }}"

      - name: Preserve BIST Fiscal Period Archive as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bist-fiscal-period-backfill-${{ github.event.inputs.year }}-${{ github.run_id }}
          path: data/generated/earnings/bist100/bist100_*_earnings_calendar.json
          if-no-files-found: error
          retention-days: 90
