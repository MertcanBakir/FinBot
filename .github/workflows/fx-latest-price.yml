name: USDTRY Latest Price Sync

on:
  schedule:
    # Weekdays hourly 08:27–00:27 Turkey time (last run is next day).
    - cron: "27 5-21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: usdtry-latest-price-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-usdtry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements/jobs/fx.txt
      - run: |
          python -m pip install --requirement requirements/jobs/fx.txt
          python -m pip check
      - name: Synchronize USDTRY Latest Price
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TIMEZONE: Europe/Istanbul
        run: python -m app.jobs.fx_latest_price_job --apply-db
