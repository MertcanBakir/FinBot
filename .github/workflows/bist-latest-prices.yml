name: BIST100 Latest Prices Sync

on:
  schedule:
    # Weekdays 10:10–18:40 Turkey time, every 30 minutes.
    - cron: "10,40 7-15 * * 1-5"
  workflow_dispatch:

concurrency:
  group: bist-latest-prices-sync
  cancel-in-progress: false

jobs:
  sync-bist-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements/jobs/bist.txt

      - name: Install Dependencies
        run: |
          python -m pip install --requirement requirements/jobs/bist.txt
          python -m pip check

      - name: Synchronize BIST100 Latest Prices
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TIMEZONE: "Europe/Istanbul"
        run: |
          python -m app.jobs.bist_latest_prices_job --apply-db
